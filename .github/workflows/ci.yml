name: CI

# Type check, unit/render tests, production build and browser tests on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (app, demos and API helpers)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Headless Chrome (preinstalled on GitHub's Ubuntu runners) against the build above.
      - name: Browser tests (map, hub and demo links)
        run: node e2e/run.mjs

      - name: Screenshots of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/output/
          if-no-files-found: ignore
