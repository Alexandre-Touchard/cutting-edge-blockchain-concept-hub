name: CI

# Type check, unit/render tests and production build on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (app, demos and API helpers)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
